name: AutoPrint OS Windows Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'feat/**', 'fix/**']
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    # Releases are created by the tag-only step below, which needs write access.
    permissions:
      contents: write
    env:
      # Compiled into the app by `npm run build`. The app no longer ships a
      # hardcoded fallback, so an installer built without these cannot sign in.
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # package-lock.json is not committed yet; npm caching needs one.
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run lint

      - name: Check Supabase build configuration
        shell: bash
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning::VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY repository secrets are not set (expected for fork PRs). The installer will build but cannot sign in."
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::Refusing to build a release without Supabase configuration."
              exit 1
            fi
          fi

      - name: Build web bundle
        run: npm run build

      - name: Package Windows installer
        run: npm run desktop:dist

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoPrint-OS-Windows
          path: release/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
